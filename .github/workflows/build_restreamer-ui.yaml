name: 'Build main restreamer-ui'

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latestversion.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Get latest version from package.json
        id: latestversion
        run: |
          echo "version=$(cat ./package.json | jq '.version' | sed 's/\"//g')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Lint with Oxlint
        run: pnpm run lint

      - name: Check TypeScript syntax
        run: pnpm run types

      - name: Build React App
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          PUBLIC_URL: './'
          DISABLE_ESLINT_PLUGIN: 'true'

      - name: Upload React build as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: restreamerui-main-build
          path: build/

  build-docker:
    needs: build-frontend
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download React build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: restreamerui-main-build
          path: build

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            kingjulian2011/reastreamer-ui
            ghcr.io/kingironman2011/restreamer-ui
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.build-frontend.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile.workflow
          build-args: |
            CADDY_IMAGE=caddy:2.7.6-alpine
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
