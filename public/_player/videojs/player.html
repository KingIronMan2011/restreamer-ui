<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{description}}" />
    <meta name="author" content="datarhei restreamer" />
    <title>{{name}}</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="alternate"
      type="application/json+oembed"
      href="channels/{{channelid}}/oembed.json"
      title="{{name}}"
    />
    <link
      rel="alternate"
      type="text/xml+oembed"
      href="channels/{{channelid}}/oembed.xml"
      title="{{name}}"
    />
    <script src="channels/{{channelid}}/config.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.6.0/live-video.js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.6.0/media/hlsjs-video.js"
    ></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }
      live-video-player {
        display: block;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }
      live-video-skin {
        display: block;
        width: 100%;
        height: 100%;
        --media-controls-before-start: visible;
      }
      .player-logo,
      .player-license {
        position: absolute;
        z-index: 5;
      }
      .player-logo {
        max-width: 25%;
        line-height: 0;
      }
      .player-logo img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .top-left {
        top: 15px;
        left: 20px;
      }
      .top {
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
      }
      .top-right {
        top: 15px;
        right: 20px;
      }
      .left {
        top: 50%;
        left: 20px;
        transform: translateY(-50%);
      }
      .center {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .right {
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
      }
      .bottom-left {
        bottom: 55px;
        left: 20px;
      }
      .bottom {
        bottom: 55px;
        left: 50%;
        transform: translateX(-50%);
      }
      .bottom-right {
        bottom: 55px;
        right: 20px;
      }
      .player-license {
        right: 12px;
        bottom: 55px;
        max-width: calc(100% - 24px);
        padding: 4px 8px;
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        font: 12px/1.4 sans-serif;
      }
    </style>
  </head>
  <body>
    <live-video-player id="player">
      <live-video-skin>
        <hlsjs-video id="player-media" playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
    <script>
      const params = new URLSearchParams(window.location.search);
      const enabled = (value) =>
        value === true ||
        ['true', '1', 'yes', 'on'].includes(String(value).toLowerCase());
      const autoplay = enabled(params.get('autoplay') ?? playerConfig.autoplay);
      const muted =
        autoplay || enabled(params.get('mute') ?? playerConfig.mute);
      const player = document.getElementById('player');
      const media = document.getElementById('player-media');
      const skin = player.querySelector('live-video-skin');
      const assetUrl = (path) =>
        new URL(
          String(path || '').replace(/^\/+/, ''),
          window.location.origin + '/',
        ).href;

      media.setAttribute('src', assetUrl(playerConfig.source));
      media.setAttribute('playsinline', '');
      if (autoplay) media.setAttribute('autoplay', '');
      if (muted) media.setAttribute('muted', '');
      if (playerConfig.poster) {
        player.setAttribute(
          'poster',
          assetUrl(playerConfig.poster) + '?t=' + Date.now(),
        );
      }

      const logo = playerConfig.logo;
      if (logo && logo.image) {
        const link = document.createElement('a');
        link.className = 'player-logo ' + (logo.position || 'top-left');
        link.href = logo.link || '#';
        if (logo.link) {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
        const image = document.createElement('img');
        image.src =
          logo.image + (logo.image.includes('?') ? '&' : '?') + Date.now();
        image.alt = 'Stream logo';
        link.appendChild(image);
        link.hidden = true;
        skin.appendChild(link);
        media.addEventListener('playing', () => {
          link.hidden = false;
        });
        media.addEventListener('pause', () => {
          link.hidden = true;
        });
      }

      const license = playerConfig.license;
      if (license && (license.license || license.title || license.author)) {
        const badge = document.createElement('small');
        badge.className = 'player-license';
        badge.textContent = [license.title, license.author, license.license]
          .filter(Boolean)
          .join(' · ');
        skin.appendChild(badge);
      }
    </script>
  </body>
</html>
